narrative: >
  Anda bertugas sebagai SOC Analyst L1. Tim monitoring menerima indikasi
  peningkatan kegagalan autentikasi SSH pada host Linux `linux-auth-01`.
  Analisis dataset log autentikasi sshd yang tersedia,
  kenali pola failed login, identifikasi akun dan source IP yang menjadi
  target, susun timeline, dan tentukan tindakan triage berdasarkan bukti.
  Dataset ini merupakan simulasi offline untuk latihan — tidak ada SSH server
  aktif maupun brute force sungguhan.

