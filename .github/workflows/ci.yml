name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # This lab is scored by the hack.redlimit.id platform, so the answer key
      # is not in the repo. If a GROUND_TRUTH_B64 secret is configured, CI also
      # verifies dataset/ground-truth consistency; otherwise that check is
      # skipped. Ground-truth-dependent tests auto-skip via the
      # `requires_ground_truth` marker (tests/conftest.py).
      - name: Validate dataset vs ground truth (only if key provided)
        env:
          GROUND_TRUTH_B64: ${{ secrets.GROUND_TRUTH_B64 }}
        run: |
          if [ -n "$GROUND_TRUTH_B64" ]; then
            python scripts/validate-dataset.py
          else
            echo "GROUND_TRUTH_B64 not set — skipping dataset/ground-truth consistency check (platform-scored lab)."
          fi

      - name: Run tests
        env:
          GROUND_TRUTH_B64: ${{ secrets.GROUND_TRUTH_B64 }}
        run: pytest -q
